name: Reporte de Hallazgo de Usabilidad
description: Documenta un problema de usabilidad encontrado en CompraFácil
title: "[Hallazgo] "
labels: ["hallazgo-usabilidad", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        👋 Estudiante, usa esta plantilla para reportar un problema de usabilidad
        encontrado en el laboratorio CompraFácil. Sé específico y aporta evidencia.

  - type: input
    id: estudiante
    attributes:
      label: Nombre del estudiante
      placeholder: "Ej: Juan Pérez"
    validations:
      required: true

  - type: dropdown
    id: categoria
    attributes:
      label: Categoría del problema
      description: ¿Qué tipo de problema encontraste?
      options:
        - Usabilidad general
        - Dark pattern
        - Accesibilidad
        - Rendimiento / carga cognitiva
        - Navegación / arquitectura de información
        - Formulario / validación
        - Diseño visual / tipografía
        - Contenido / microcopy
        - Otro
    validations:
      required: true

  - type: dropdown
    id: principio
    attributes:
      label: Principio violado
      description: ¿Qué principio estudiado en clase aplica?
      options:
        - ISO 9241-11 (eficacia, eficiencia, satisfacción)
        - Heurística de Nielsen (indicar número)
        - Ley de Hick (tiempo de decisión = log₂ opciones)
        - Ley de Miller (7±2 chunks)
        - Ley de Fitts (tamaño/distancia del objetivo)
        - Principios de Gestalt (proximidad, similitud, cierre, etc.)
        - Carga cognitiva intrínseca/extrínseca/germana
        - Pre-selected opt-in / consentimiento manipulativo
        - Hidden costs / bait and switch
        - Confirmshaming / roach motel
        - Forced continuity / sneak into basket
        - Disguised ads / friend spam
        - Otro / no estoy seguro
    validations:
      required: true

  - type: input
    id: pantalla
    attributes:
      label: Pantalla o sección donde ocurre
      placeholder: "Ej: /checkout paso 2, página de detalle, modal de carrito, etc."
    validations:
      required: true

  - type: textarea
    id: descripcion
    attributes:
      label: Descripción del problema
      description: ¿Qué ocurre? Sé objetivo y describe lo que observaste, no lo que imaginas.
      placeholder: |
        Describe el problema en 2-4 oraciones. Ej:
        El botón "Confirmar compra" mide apenas 24x24 px y está en color gris
        claro en la esquina inferior derecha. El botón "Cancelar y volver"
        mide 240x80 px, está centrado y tiene animación pulsante roja.
    validations:
      required: true

  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia / pasos para reproducir
      description: Pasos exactos para que el docente pueda reproducir el problema.
      placeholder: |
        1. Ir a /checkout
        2. Llenar el formulario
        3. Observar los botones de la parte inferior
    validations:
      required: true

  - type: textarea
    id: impacto
    attributes:
      label: Impacto para el usuario
      description: ¿Cómo afecta esto al usuario? ¿Frustración? ¿Pérdida de tiempo? ¿Decisión no informada?
      placeholder: |
        El usuario puede cancelar accidentalmente la compra en lugar de
        confirmarla. Fitts dice que targets pequeños y lejanos penalizan el
        tiempo de selección, y aquí el botón de la acción PRINCIPAL es el
        pequeño, no el de cancelar.
    validations:
      required: true

  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
    options:
      - Baja (molestia menor, no afecta el objetivo)
      - Media (afecta la experiencia, workaround fácil)
      - Alta (bloquea el objetivo o engaña al usuario)
      - Crítica (causa pérdida de datos, dinero, o privacidad)
    validations:
      required: true

  - type: textarea
    id: solucion
    attributes:
      label: Solución propuesta
      description: ¿Cómo arreglarías el problema? Puede ser texto, mockup en código, o referencia.
      placeholder: |
        - Hacer el botón "Confirmar" de al menos 88x44 px (recomendación móvil)
        - Darle color primario de la marca (azul, no gris)
        - Quitar la animación pulsante del botón Cancelar
    validations:
      required: true

  - type: input
    id: capturas
    attributes:
      label: Capturas de pantalla (URLs o adjuntos)
      description: Pega aquí URLs de imágenes, o sube adjuntos al issue.
      placeholder: "![captura](https://...) o arrastra imágenes aquí"
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Verificación antes de enviar
    options:
      - label: Reproduje el problema al menos 2 veces
        required: true
      - label: Adjunté al menos una captura
        required: false
      - label: Relacioné el problema con un principio de la Sesión 5
        required: true
      - label: Propuse una solución concreta (no solo "mejorar el diseño")
        required: true
