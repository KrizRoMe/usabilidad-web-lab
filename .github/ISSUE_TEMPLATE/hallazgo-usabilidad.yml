- type: checkboxes
  id: checks
  attributes:
    label: Confirmo que es correcto
    options:
    - label: Completé los 4 hallazgos (o justifiqué abajo si reporto menos)
      required: true
    - label: Cada hallazgo está asociado a un principio de la Sesión 5
      required: true
    - label: Cada hallazgo tiene pasos para reproducir y al menos 1 captura
      required: true
    - label: Cada hallazgo tiene una solución concreta, no genérica
      required: true
- type: textarea
  id: justificacion
  attributes:
    label: Si reportas menos de 4 hallazgos, justifica aquí por qué
    placeholder: 'Solo si marcaste ''Menos de 3'' arriba. Ej: ''No pude identificar más problemas de los 12 pre-existentes.'''
  validations:
    required: false
